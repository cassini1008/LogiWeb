<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nuevo Envío Aéreo</title></head>
<body>
<h1>Registrar envío aéreo</h1>
<form th:action="@{/envio/aereo/nuevo}" method="post">
    Código: <input type="text" name="codigo" required><br>
    Origen: <input type="text" name="origen" required><br>
    Destino: <input type="text" name="destino" required><br>
    Peso (kg): <input type="number" step="0.1" name="pesoKg" required><br>
    Código de vuelo: <input type="text" name="codigoVuelo" required><br>
    País aduana: <input type="text" name="pais" required><br>
    Impuesto: <input type="number" step="0.1" name="impuesto" required><br>
    <button type="submit">Guardar</button>
</form>
<a th:href="@{/}">Volver</a>
</body>
</html>
